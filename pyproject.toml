[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bls-corpus"
version = "0.1.0"
description = "Download and parse any BLS LABSTAT survey into Parquet and JSON"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pyarrow>=16",
    "duckdb>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bls-corpus = "bls_corpus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
